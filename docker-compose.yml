version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: open-bento
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - /apps/website/.env
    environment:
      - ORIGIN="http://localhost:3000"
      - DATABASE_PATH="file:/app/db/local.db"
      - DATABASE_MIGRATIONS_PATH="/app/migrations"
    volumes:
      - db:/app/db

volumes:
  db: